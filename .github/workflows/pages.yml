name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Never cancel a running deploy; just queue the next one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          pip install --quiet pillow

      - name: Parser tests
        run: npm test

      - name: Check the fixture corpus is in sync
        run: |
          python3 tools/make_fixtures.py /tmp/regen
          diff <(cd test/fixtures && ls) <(cd /tmp/regen && ls)
          diff test/fixtures/index.json /tmp/regen/index.json

      - name: Serve the app
        run: |
          npx --yes http-server -p 8099 -c-1 --silent . &
          npx --yes wait-on http://localhost:8099/index.html --timeout 60000

      - name: App end-to-end tests
        run: node test/app.e2e.mjs

      - name: Deploy and update tests
        run: node test/update.e2e.mjs

      - name: OCR accuracy benchmark
        run: node test/ocr-bench.mjs

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: test/shots/
          if-no-files-found: ignore

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp the build id into the service worker
        # Without this the shell cache name never changes, so a deploy that
        # touched only app.js would never reach anyone who already installed
        # the app.
        run: |
          sed -i "s/__BUILD__/${GITHUB_SHA::12}/" sw.js
          if grep -q "__BUILD__" sw.js; then
            echo "build id was not substituted into sw.js"
            exit 1
          fi
          grep "const BUILD" sw.js

      - name: Assemble the site
        run: |
          rm -rf ../site && mkdir ../site
          cp -r index.html styles.css app.js parser.js sw.js rate.json \
                manifest.webmanifest icons vendor LICENSE README.md ../site/
          touch ../site/.nojekyll
          du -sh ../site

      - name: Publish to gh-pages
        # Pages is configured to serve the gh-pages branch. Deploying by push
        # keeps the whole flow inside the default token's permissions.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages --depth=1 || true
          git checkout -B gh-pages
          git rm -rq --cached . || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r ../site/. .
          git add -A
          if git diff --cached --quiet; then
            echo "site unchanged"
            exit 0
          fi
          git commit -m "Deploy ${GITHUB_SHA::12}"
          git push --force origin gh-pages

      - name: Wait for the site to serve the new build
        run: |
          url="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/sw.js"
          echo "checking $url"
          for i in $(seq 1 30); do
            if curl -fsS --max-time 20 "$url" | grep -q "${GITHUB_SHA::12}"; then
              echo "live build is ${GITHUB_SHA::12}"
              exit 0
            fi
            sleep 20
          done
          echo "the deployed site did not pick up ${GITHUB_SHA::12} in time"
          exit 1

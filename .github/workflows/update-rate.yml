name: Refresh bundled exchange rate

# The app fetches a live rate whenever it has a connection. This job only keeps
# the bundled fallback in rate.json fresh, so a brand-new install (or one that
# has been offline for a long time) starts from a sane number.

on:
  schedule:
    - cron: '17 3 * * 1' # Mondays, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A scheduled run checks out whatever ref triggered it; be explicit so
          # the refreshed rate always lands on main and gets deployed.
          ref: main

      - name: Fetch đồng rates
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const { CURRENCIES } = require('./parser.js');
          (async () => {
            const res = await fetch('https://open.er-api.com/v6/latest/VND');
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const json = await res.json();
            const rates = json.rates || {};
            const out = {};
            for (const code of Object.keys(CURRENCIES)) {
              const perDong = rates[code];
              if (!(perDong > 0)) continue;
              const vndPerUnit = Math.round((1 / perDong) * 100) / 100;
              // A sane exchange rate, not a broken feed.
              if (vndPerUnit > 0.5 && vndPerUnit < 5e6) out[code] = vndPerUnit;
            }
            if (Object.keys(out).length < 8) {
              throw new Error('only got ' + Object.keys(out).length + ' usable rates');
            }
            const doc = JSON.parse(fs.readFileSync('rate.json', 'utf8'));
            doc.vndPerUnit = out;
            doc.asOf = new Date(json.time_last_update_unix * 1000).toISOString();
            doc.source = 'open.er-api.com';
            fs.writeFileSync('rate.json', JSON.stringify(doc, null, 2) + '\n');
            console.log('rates:', Object.keys(out).length, '· TWD', out.TWD, '· USD', out.USD);
          })().catch((e) => { console.error(e); process.exit(1); });
          EOF

      - name: Commit if changed
        run: |
          if git diff --quiet rate.json; then
            echo "rate unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: refresh the bundled đồng exchange rates"
          git push origin HEAD:main

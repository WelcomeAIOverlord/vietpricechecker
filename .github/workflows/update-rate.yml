name: Refresh bundled exchange rate

# The app fetches a live rate whenever it has a connection. This job only keeps
# the bundled fallback in rate.json fresh, so a brand-new install (or one that
# has been offline for a long time) starts from a sane number.

on:
  schedule:
    - cron: '17 3 * * 1' # Mondays, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch VND → TWD
        run: |
          node - <<'EOF'
          const fs = require('fs');
          (async () => {
            const res = await fetch('https://open.er-api.com/v6/latest/VND');
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const json = await res.json();
            const twdPerVnd = json.rates && json.rates.TWD;
            if (!twdPerVnd) throw new Error('no TWD rate in response');
            const vndPerTwd = Math.round((1 / twdPerVnd) * 10) / 10;
            if (!(vndPerTwd > 100 && vndPerTwd < 100000)) throw new Error('implausible rate ' + vndPerTwd);
            const current = JSON.parse(fs.readFileSync('rate.json', 'utf8'));
            current.vndPerTwd = vndPerTwd;
            current.asOf = new Date(json.time_last_update_unix * 1000).toISOString();
            current.source = 'open.er-api.com';
            fs.writeFileSync('rate.json', JSON.stringify(current, null, 2) + '\n');
            console.log('vndPerTwd =', vndPerTwd);
          })().catch((e) => { console.error(e); process.exit(1); });
          EOF

      - name: Commit if changed
        run: |
          if git diff --quiet rate.json; then
            echo "rate unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: refresh bundled VND/TWD fallback rate"
          git push
